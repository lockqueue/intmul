# IntMulTM: O(n log n) integer multiplication on a multi-stack Turing machine.
# Headline: IntMulTM.intMul_TM2_nlogn : IntMulTM.IntMulNLogN (IntMulTM/Headline.lean).
#   lake exe cache get   # prebuilt Mathlib oleans
#   lake build           # all libraries below
# Lake globs: "X.*" = X and its submodules, "X.+" = submodules only (no X.lean root file).
name = "intmul_tm"
version = "0.1.0"
defaultTargets = ["AxiomCheck", "Contracts", "IntMul", "IntMulTM", "LevelSync", "WP", "SubNLogN"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "AxiomCheck"
globs = ["AxiomCheck"]

[[lean_lib]]
name = "Contracts"
globs = ["Contracts.+"]

[[lean_lib]]
name = "IntMul"
globs = ["IntMul.*"]

[[lean_lib]]
name = "IntMulTM"
globs = ["IntMulTM.+"]

[[lean_lib]]
name = "LevelSync"
globs = ["LevelSync.+"]

[[lean_lib]]
name = "WP"
globs = ["WP.+"]

[[lean_lib]]
name = "SubNLogN"
globs = ["SubNLogN.+"]
