[project]
name = "subnlogn"
version = "1.0.0"
description = "Exact-arithmetic Python reference implementation accompanying 'A simpler algorithm for integer multiplication below n log n, with a formally verified proof'"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["mpmath==1.3.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-xdist==3.8.0", "hypothesis==6.168.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -q"
markers = [
    "slow: long-running tests (run with -m slow)",
]
filterwarnings = ["error"]
